  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent

    body {
      font-family: "Inter", sans-serif;
      background: #fff;
      color: #111

    .logo-ph {
      width: 48px;
      height: 48px;
      border: 2px dashed #D6AF68;

    /* CARD */
    .jersey-card {
      background: #f9f9f9;
      border: 1px solid #ececec;

      overflow: hidden;
      cursor: pointer;
      transition: transform .3s, box-shadow .3s

      object-fit: cover;
      object-position: center;
      display: block;
      background: #f0f0f0;
      transition: transform .4s

    .jersey-card:hover img {
      transform: scale(1.06)

    /* TAG */
    .tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: .5px;
      text-transform: uppercase

      color: #2e7d32

    .tag-se {
      background: #fce4ec;
      color: #ad1457

    /* DRAWER */

    .btn-wpp:hover {

    .nav-link {

      letter-spacing: .06em;

      color: #fff;

    .nav-link:hover {
      color: #D6AF68
    }

    ::-webkit-scrollbar {
      display: none
    }

    #overlay {
      transition: opacity .3s
    }
  </style>

  <script src="csv_loader.js?v=37"></script>
  <script src="app.js?v=37"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // Parse params manually to handle file:// protocols better
      let searchStr = window.location.search;
      if (!searchStr && window.location.href.includes('?')) {
        searchStr = window.location.href.substring(window.location.href.indexOf('?'));
      }
      const urlParams = new URLSearchParams(searchStr);
      let catName = urlParams.get('v');

      // Fallback in case of wrong URL
      if (!catName) {
        document.getElementById('category-title').innerText = 'Categoria não encontrada';
        document.getElementById('category-count').innerText = 'Volte para a página inicial e tente novamente.';
        return;
      }

      document.getElementById('category-title').innerText = catName.toUpperCase();
      document.title = catName + " – Seu Manto";

      let currentTypeFilter = 'all';
      let currentTeamFilter = 'all';
      let currentLigaFilter = 'all';

      // Use the shared global TEAM_BADGES defined in app.js (window.TEAM_BADGES)
      // Falls back to empty object if app.js hasn't loaded yet
      const TEAM_BADGES = window.TEAM_BADGES || {};

      const renderGrid = () => {
        const productKeys = Object.keys(PRODUCTS);
        // Espera infinitamente até o csv_loader/app.js?v=37 carregar os produtos
        if (productKeys.length === 0) {
          setTimeout(renderGrid, 100);
          return;
        }

        const allProducts = [];
        Object.values(PRODUCTS).forEach(catArray => {
          catArray.forEach(p => {
            if (!p.vitrines) p.vitrines = ['Lançamentos'];
            allProducts.push(p);
          });
        });

        // Smart Categorization: Match team name, league, vitrine, or full name
        const searchVal = catName.toLowerCase().trim();
        const removeAccents = str => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");

        let baseItems = allProducts.filter(p => {
          // Exact matches for specific categories/vitrines
          if (p.vitrines && p.vitrines.some(v => v.toLowerCase() === searchVal)) return true;
          if (p.liga && p.liga.toLowerCase() === searchVal) return true;
          if (searchVal === 'brasileiros' && (p.liga === 'Brasileirão' || p.category === 'brasileirao')) return true;
          if (searchVal === 'internacionais' && (p.liga !== 'Brasileirão' && p.category !== 'brasileirao')) return true;

          // Tokenized robust search
          const stopwords = ['de', 'do', 'da', 'dos', 'das', 'e', 'para', 'com', 'camisas', 'camisa'];
          let searchTokens = removeAccents(searchVal).split(/\s+/).filter(t => t && !stopwords.includes(t));
          
          // Simple plural stemming (remove 's' at the end)
          searchTokens = searchTokens.map(t => (t.endsWith('s') && t.length > 3) ? t.slice(0, -1) : t);
          
          // Se a busca for só "camisa" ou "camisas", a array de tokens fica vazia por causa do stopword.
          // Nesse caso, queremos retornar tudo (que seja camisa).
          if (searchTokens.length === 0 && (searchVal.includes('camisa') || searchVal.includes('camisas'))) {
             return p.type && p.type.toLowerCase() === 'camisa';
          }
          if (searchTokens.length === 0) return true; // fallback

          const searchableText = removeAccents(`${p.name} ${p.fullName} ${p.team} ${p.tagLabel} ${p.type} ${p.liga}`).toLowerCase();
          
          return searchTokens.every(token => searchableText.includes(token));
        });

        // Apply liga filter first to determine available teams
        let ligaItems = currentLigaFilter !== 'all'
          ? baseItems.filter(p => p.liga === currentLigaFilter)
          : baseItems;

        // Always re-render filters (liga buttons from all, team badges from liga-filtered)
        renderFilters(baseItems, ligaItems);

        // Apply remaining filters
        let items = ligaItems;
        if (currentTypeFilter !== 'all') {
          items = items.filter(p => p.type === currentTypeFilter);
        }
        if (currentTeamFilter !== 'all') {
          items = items.filter(p => p.team === currentTeamFilter);
        }

        // Aplicar a mesma lógica de variedade para evitar grupos do mesmo time
        if (window.getVariedItems && items.length > 0 && currentTeamFilter === 'all') {
          items = window.getVariedItems(items, items.length);
        }

        const PAGE_SIZE = 20;
        const totalItems = items.length;
        const totalPages = Math.ceil(totalItems / PAGE_SIZE) || 1;

        if (window.currentPage > totalPages) window.currentPage = totalPages;

        const start = (window.currentPage - 1) * PAGE_SIZE;
        const end = start + PAGE_SIZE;
        const paginatedItems = items.slice(start, end);

        document.getElementById('category-count').innerText = "Mostrando " + paginatedItems.length + " de " + totalItems + " produtos";
        document.getElementById('results-count').innerText = totalItems + " produto(s) encontrado(s)";

        const gridEl = document.getElementById('category-grid');
        if (paginatedItems.length > 0) {
          gridEl.innerHTML = paginatedItems.map(cardHTML).join("");
        } else {
          gridEl.innerHTML = "<p class='col-span-full text-center text-gray-500 py-10'>Nenhum produto encontrado.</p>";
        }

        // Render Pagination
        const pagEl = document.getElementById('pagination');
        if (totalPages > 1) {
          let pHtml = '';
          if (window.currentPage > 1) {
            pHtml += `<button onclick="setPage(${window.currentPage - 1})" class="px-3 py-1.5 border border-gray-200 rounded-md text-sm font-semibold hover:border-gold hover:text-gold">&laquo; Anterior</button>`;
          }

          let startPage = Math.max(1, window.currentPage - 2);
          let endPage = Math.min(totalPages, startPage + 4);
          if (endPage - startPage < 4) {
            startPage = Math.max(1, endPage - 4);
          }

          for (let i = startPage; i <= endPage; i++) {
            if (i === window.currentPage) {
              pHtml += `<span class="px-3 py-1.5 bg-gold text-white rounded-md text-sm font-bold">${i}</span>`;
            } else {
              pHtml += `<button onclick="setPage(${i})" class="px-3 py-1.5 border border-gray-200 rounded-md text-sm hover:border-gold hover:text-gold">${i}</button>`;
            }
          }

          if (window.currentPage < totalPages) {
            pHtml += `<button onclick="setPage(${window.currentPage + 1})" class="px-3 py-1.5 border border-gray-200 rounded-md text-sm font-semibold hover:border-gold hover:text-gold">Próxima &raquo;</button>`;
          }
          pagEl.innerHTML = pHtml;
        } else {
          pagEl.innerHTML = '';
        }
      };

      const renderFilters = (baseItems, teamSourceItems) => {
        if (!teamSourceItems) teamSourceItems = baseItems;
        let types = [];
        let teams = [];
        let ligas = [];
        baseItems.forEach(p => {
          if (p.type && !types.includes(p.type)) types.push(p.type);
          if (p.liga && !ligas.includes(p.liga) && p.liga !== p.category) ligas.push(p.liga);
        });
        teamSourceItems.forEach(p => {
          if (p.team && !teams.includes(p.team)) teams.push(p.team);
        });
        types.sort();
        teams.sort();
        ligas.sort();

        // Render Liga Filters
        const ligaContainer = document.getElementById('liga-filters-container');
        if (ligas.length > 1) {
          ligaContainer.innerHTML = `<button class="filter-btn ${currentLigaFilter === 'all' ? 'active' : 'inactive'}" onclick="setLigaFilter('all')">Todas as Ligas</button>`;
          ligas.forEach(liga => {
             ligaContainer.innerHTML += `<button class="filter-btn ${currentLigaFilter === liga ? 'active' : 'inactive'}" onclick="setLigaFilter('${liga}')">${liga}</button>`;
          });
          ligaContainer.style.display = 'flex';
        } else {
          ligaContainer.style.display = 'none';
        }

        const typeContainer = document.getElementById('type-filters-container');
        typeContainer.innerHTML = `<button class="filter-btn ${currentTypeFilter === 'all' ? 'active' : 'inactive'}" onclick="setTypeFilter('all')">Ver Tudo</button>`;

        const pluralize = (t) => {
          if (t.toLowerCase() === 'calção') return 'Calções';
          if (t.toLowerCase() === 'corta vento') return 'Corta Ventos';
          if (t.toLowerCase() === 'infantil') return 'Infantil';
          if (t.toLowerCase() === 'feminino') return 'Feminino';
          if (t.endsWith('s')) return t; // Already plural (e.g. Kits)
          return t + 's';
        };

        types.forEach(type => {
          typeContainer.innerHTML += `<button class="filter-btn ${currentTypeFilter === type ? 'active' : 'inactive'}" onclick="setTypeFilter('${type}')">${pluralize(type)}</button>`;
        });

        // Render Team Filters
        const teamContainer = document.getElementById('team-filters-container');
        teamContainer.innerHTML = `<button class="filter-btn ${currentTeamFilter === 'all' ? 'active' : 'inactive'}" onclick="setTeamFilter('all')">Todos os Times</button>`;

        teams.forEach(team => {
          const badgeUrl = TEAM_BADGES[team.toLowerCase()];
          if (badgeUrl) {
            teamContainer.innerHTML += `
                <button class="team-badge-btn ${currentTeamFilter === team ? 'active' : ''}" onclick="setTeamFilter('${team}')" title="${team}">
                   <img src="${badgeUrl}" alt="${team}">
                </button>
              `;
          } else {
            teamContainer.innerHTML += `
                <button class="filter-btn ${currentTeamFilter === team ? 'active' : 'inactive'}" style="font-size: 11px; padding: 4px 10px;" onclick="setTeamFilter('${team}')">${team}</button>
              `;
          }
        });
        
        teamContainer.style.display = 'flex';
      };

      window.setLigaFilter = (liga) => {
        currentLigaFilter = liga;
        currentTeamFilter = 'all'; // reset team when liga changes
        window.currentPage = 1;

        const ligaBtns = document.getElementById('liga-filters-container').querySelectorAll('button');
        ligaBtns.forEach(btn => {
          const onclickVal = btn.getAttribute('onclick');
          if (onclickVal.includes(`'${liga}'`) || (liga === 'all' && onclickVal.includes("'all'"))) {
            btn.classList.add('active');
            btn.classList.remove('inactive');
          } else {
            btn.classList.add('inactive');
            btn.classList.remove('active');
          }
        });

        renderGrid();
      };

      window.setTypeFilter = (type) => {
        currentTypeFilter = type;
        window.currentPage = 1;

        // Update Type Filter Classes
        const typeBtns = document.getElementById('type-filters-container').querySelectorAll('button');
        typeBtns.forEach(btn => {
          const onclickVal = btn.getAttribute('onclick');
          if (onclickVal.includes(`'${type}'`) || (type === 'all' && onclickVal.includes("'all'"))) {
            btn.classList.add('active');
            btn.classList.remove('inactive');
          } else {
            btn.classList.add('inactive');
            btn.classList.remove('active');
          }
        });

        renderGrid();
      };

      window.setTeamFilter = (team) => {
        // Toggle behavior
        if (currentTeamFilter === team) {
          currentTeamFilter = 'all';
        } else {
          currentTeamFilter = team;
        }
        window.currentPage = 1;

        // Update Team Filter Classes
        const teamBtns = document.getElementById('team-filters-container').querySelectorAll('button');
        teamBtns.forEach(btn => {
          const onclickVal = btn.getAttribute('onclick');
          if (onclickVal.includes(`'${currentTeamFilter}'`)) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });

        renderGrid();
      };

      window.setPage = (page) => {
        window.currentPage = page;
        // Scroll to top of grid
        document.getElementById('category-grid').scrollIntoView({ behavior: 'smooth' });
        renderGrid();
      };

      window.currentPage = parseInt(urlParams.get('page')) || 1;
      window.filtersRendered = false;

      renderGrid();
    });
  </script>
</body>

</html>
