  <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Carregar banners do localStorage
      let bannersData = null;
      try {
        bannersData = JSON.parse(localStorage.getItem('seumanto_banners'));
      } catch (e) {}

      // Fallback
      if (!bannersData || !bannersData.home_desktop) {
        bannersData = {
          home_desktop: ["assets/img/banner_home_desktop.jpg"],
          home_mobile: ["assets/img/banner_home_desktop.jpg"]
        };
      }
      
      // Se for string antiga, converte para array
      let desktops = Array.isArray(bannersData.home_desktop) ? bannersData.home_desktop : [bannersData.home_desktop];
      let mobiles = Array.isArray(bannersData.home_mobile) ? bannersData.home_mobile : [bannersData.home_mobile];
      let links = Array.isArray(bannersData.home_links) ? bannersData.home_links : (bannersData.home_links ? [bannersData.home_links] : []);
      
      // Strict fallback caso esteja vazio
      if (!desktops || desktops.length === 0 || !desktops[0]) {
        desktops = ["assets/img/banner_home_desktop.jpg"];
      }
      if (!mobiles || mobiles.length === 0 || !mobiles[0]) {
        mobiles = desktops; // usa o desktop se não tiver mobile
      }

      // Auto-corrigir extensões .jfif para .jpg
      desktops = desktops.map(url => url ? url.replace(/\.jfif$/i, '.jpg') : url);
      mobiles = mobiles.map(url => url ? url.replace(/\.jfif$/i, '.jpg') : url);

      const wrapper = document.getElementById('home-banner-wrapper');
      
      if (desktops.length > 0 && desktops[0]) {
        let html = '';
        const maxBanners = Math.max(desktops.length, mobiles.length);
        const fallbackUrl = 'https://placehold.co/1920x600/222/D6AF68?text=Imagem+Nao+Encontrada';
        for (let i = 0; i < maxBanners; i++) {
          let dImg = desktops[i] || desktops[0];
          let mImg = mobiles[i] || dImg || mobiles[0];
          let link = links[i] || "";
          
          let imgContent = `
              <img src="${dImg}" onerror="this.src='${fallbackUrl}'" class="hidden lg:block w-full h-auto object-cover" alt="Banner ${i+1} Desktop">
              <img src="${mImg}" onerror="this.src='${fallbackUrl}'" class="block lg:hidden w-full h-auto object-cover" alt="Banner ${i+1} Mobile">
          `;
          let slideContent = link ? `<a href="${link}" class="block w-full h-full">${imgContent}</a>` : imgContent;
          
          html += `
            <div class="swiper-slide cursor-pointer">
              ${slideContent}
            </div>
          `;
        }
        wrapper.innerHTML = html;
      }

      // Inicia o carrossel
      new Swiper(".bannerSwiper", {
        loop: true,
        autoplay: {
          delay: 4000,
          disableOnInteraction: false,
        },
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
      });

      // Atualiza os outros banners fixos na página (se existirem)
      const setBannerSrc = (id, srcArray) => {
        const el = document.getElementById(id);
        if (el && srcArray) {
          let src = Array.isArray(srcArray) ? srcArray[0] : srcArray;
          if (src) {
            src = src.replace(/\.jfif$/i, '.jpg');
            el.src = src;
          }
        }
      };

      setBannerSrc('banner-cat-nac-d', bannersData.cat_nac_d);
      setBannerSrc('banner-cat-nac-m', bannersData.cat_nac_m);
      setBannerSrc('banner-cat-int-d', bannersData.cat_int_d);
      setBannerSrc('banner-cat-int-m', bannersData.cat_int_m);
      setBannerSrc('banner-cat-ret-d', bannersData.cat_ret_d);
      setBannerSrc('banner-cat-ret-m', bannersData.cat_ret_m);
      setBannerSrc('banner-grid-d', bannersData.grids_desktop);
      setBannerSrc('banner-grid-m', bannersData.grids_mobile);
    });
  </script>
